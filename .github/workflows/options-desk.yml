name: Options desk checks

on:
  push:
    paths:
      - 'options_lab/**'
      - 'tests_options/**'
      - 'docs/options-desk/**'
      - 'tests/risk_lab.test.mjs'
      - '.github/workflows/options-desk.yml'
  pull_request:
    paths:
      - 'options_lab/**'
      - 'tests_options/**'
      - 'docs/options-desk/**'
      - 'tests/risk_lab.test.mjs'
      - '.github/workflows/options-desk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: options_lab/requirements.lock.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned options environment
        run: |
          python -m pip install -r options_lab/requirements.lock.txt
          python -m pip check
      - name: Pricing, hedging and Risk Lab regression tests
        run: python -m pytest tests_options -q --junitxml=options_lab_runs/ci/tests.xml
      - name: Original research integrity
        run: |
          python - <<'PY'
          import json
          from options_lab.validate import guard_original
          result = guard_original()
          print(json.dumps(result, indent=2))
          assert result['status'] == 'passed', result
          PY
      - name: Risk Lab browser calculations
        run: node --test tests/risk_lab.test.mjs
