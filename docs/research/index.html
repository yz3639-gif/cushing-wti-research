<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1118">
  <meta name="description" content="Cushing inventory research by Antony Zuo, using historical public data. Read the original report and explore the companion WTI Options Desk.">
  <title>Cushing Inventory Research | Antony Zuo</title>
  <link rel="icon" href="../options-desk/az-mark.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #edf1f5; background: #0b1118; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; height: 100dvh; min-height: 320px; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; padding: 14px 24px; border-bottom: 1px solid #2a3542; background: #0b1118; }
    .identity { display: flex; align-items: center; gap: 12px; }
    .monogram { display: grid; place-items: center; width: 36px; height: 36px; flex: 0 0 auto; border: 1px solid #6c5738; border-radius: 8px; color: #edba68; font-size: 15px; font-weight: 700; }
    h1 { margin: 0; font-size: 17px; line-height: 1.35; font-weight: 650; letter-spacing: -.02em; }
    .byline { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 3px; color: #a7b5c4; font-size: 12px; line-height: 1.5; }
    .data-label { color: #6dd8c0; }
    nav { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; line-height: 1.4; }
    a { color: #c7d1dc; text-underline-offset: 4px; }
    a:hover { color: #fff; }
    a:focus-visible { outline: 2px solid #edba68; outline-offset: 5px; border-radius: 2px; }
    .desk-link { padding: 9px 13px; border: 1px solid #8a6b3b; border-radius: 6px; background: #211d17; color: #edba68; font-weight: 600; text-decoration: none; }
    .desk-link:hover { background: #33291c; color: #f8d7a1; }
    main { display: flex; flex: 1; min-height: 0; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #0b1118; }
    @media (max-width: 640px) {
      header { padding: 12px 16px; gap: 12px; }
      nav { width: 100%; gap: 10px 16px; }
      h1 { font-size: 16px; }
      .desk-link { margin-left: auto; }
    }
    @media (max-width: 380px) { .desk-link { margin-left: 0; } }
  </style>
</head>
<body>
  <header>
    <div class="identity">
      <span class="monogram" aria-hidden="true">AZ</span>
      <div>
        <h1>Cushing Inventory Research</h1>
        <div class="byline"><span>By Antony Zuo</span><span class="data-label">Historical public data</span></div>
      </div>
    </div>
    <nav aria-label="Research and companion project">
      <a href="../index.html">Open report directly</a>
      <a href="https://github.com/yz3639-gif/cushing-wti-research">View source</a>
      <a class="desk-link" href="../options-desk/">Options Desk &rarr;</a>
    </nav>
  </header>
  <main aria-label="Original research report">
    <iframe src="../index.html" title="Cushing inventory and WTI calendar spread research report"></iframe>
  </main>
</body>
</html>
